name: Build and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Build and isolated regressions
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit, storage, permissions, season and mocked-email regressions
        run: npm test
        env:
          NODE_OPTIONS: --import=./tests/no-network.mjs
      - name: Verify production build (no deploy)
        run: npm run build
      - name: Verify runner bundles (no imports)
        run: node scripts/build-runner.mjs
  browser:
    name: Desktop regressions (${{ matrix.browser }})
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Synthetic UI, scrolling rollback and failure recovery
        run: npm run test:browser
        env:
          AUDIT_BROWSER: ${{ matrix.browser }}
      # Fixtures and screenshots remain on the disposable runner. Never upload
      # raw diagnostics, production data, backups or browser storage as artifacts.
