name: Sync approved Movebank studies
on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: Force a full reconciliation of all approved studies
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: movebank-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build-runner.mjs
      - name: Sync and discover approved storks
        run: node .runner/sync.mjs
        env:
          APP_ORIGIN: https://storkleague.fans
          MOVEBANK_API_TOKEN: ${{ secrets.MOVEBANK_API_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          FORCE_RECONCILE: ${{ inputs.reconcile && 'true' || 'false' }}

